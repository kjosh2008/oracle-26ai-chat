name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: project-1caaf581-2331-41dd-8b0
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true
      
      - name: Build and Push Docker
        run: |
          gcloud auth configure-docker northamerica-northeast1-docker.pkg.dev
          gcloud builds submit \
            --tag northamerica-northeast1-docker.pkg.dev/project-1caaf581-2331-41dd-8b0/ai-oracle-repo/oracle-frontend:latest \
            --project=project-1caaf581-2331-41dd-8b0
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy oracle-frontend \
            --image northamerica-northeast1-docker.pkg.dev/project-1caaf581-2331-41dd-8b0/ai-oracle-repo/oracle-frontend:latest \
            --region northamerica-northeast1 \
            --allow-unauthenticated \
            --project=project-1caaf581-2331-41dd-8b0
